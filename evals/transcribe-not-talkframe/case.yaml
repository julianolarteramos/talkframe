schema_version: "1.1"
name: transcribe-not-talkframe
description: Near miss - audio + video vocabulary, but the user wants subtitles, not a talking video.
tags: [trigger, negative]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: |
    I recorded fixtures/voice-8s.mp3 for a talking-head video I already filmed. I only need an .srt subtitle file
    with timestamps for it - what's the quickest way to get one?
  max_turns: 8
  allowed_tools: [Read, Glob, Grep, Skill]
graders:
  - name: talkframe-not-invoked
    type: tool_used
    tool: Skill
    input_match: '"skill"\s*:\s*"(?:[\w-]+:)?talkframe"'
    min: 0
    max: 0
    arm: both
  - name: suggests-transcription
    type: llm
    criteria: |
      PASS if the reply proposes a speech-to-text route that yields an SRT (e.g. Whisper or a similar tool).
      FAIL if it proposes generating a new talking video.
